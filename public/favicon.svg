<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich amber bronze -->
    <radialGradient id="amberGlow" cx="48%" cy="36%" r="68%" fx="42%" fy="28%">
      <stop offset="0%" stop-color="#cf6d03" />
      <stop offset="35%" stop-color="#b65700" />
      <stop offset="70%" stop-color="#7c3300" />
      <stop offset="100%" stop-color="#4a1c00" />
    </radialGradient>

    <!-- Outer Bevel Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a34e00" />
      <stop offset="40%" stop-color="#6e2e00" />
      <stop offset="85%" stop-color="#3d1500" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bottom Gloss Reflection -->
    <linearGradient id="bottomGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0" />
      <stop offset="100%" stop-color="#e6820c" stop-opacity="0.65" />
    </linearGradient>

    <!-- Drop Shadow for Letter G -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2a0f00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Dark Rim -->
  <rect x="8" y="8" width="496" height="496" rx="142" ry="142" fill="#2d1100" />

  <!-- Main Body with Amber Bronze Radial Glow -->
  <rect x="12" y="12" width="488" height="488" rx="138" ry="138" fill="url(#amberGlow)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Lower Bevel Crescent/Reflection -->
  <path d="M 60 410 C 130 460 382 460 452 410 C 430 465 375 490 256 490 C 137 490 82 465 60 410 Z" fill="url(#bottomGloss)" opacity="0.85" />

  <!-- Letter G: Classical Serif Glyph -->
  <text
    x="256"
    y="346"
    font-family="'Cinzel', 'Georgia', 'Baskerville', 'Times New Roman', serif"
    font-size="284"
    font-weight="700"
    fill="#fceea7"
    text-anchor="middle"
    filter="url(#softGlow)"
  >G</text>
</svg>
